[project]
name = "sovereign-rag"
version = "0.0.1"
description = "Offline-first RAG over small public Spanish/EU corpora with mandatory citations and an honest 'I don't know'."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "jorgitobg" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
sovereign-rag-demo = "sovereign_rag.demo:main"
sovereign-rag-eval = "sovereign_rag.eval:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_rag"]

[tool.hatch.build.targets.wheel.force-include]
"tests/fixtures/boe" = "sovereign_rag/data/boe"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
addopts = "-q --cov=sovereign_rag --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["src"]
